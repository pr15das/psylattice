<style>
  @keyframes sqDash { to { stroke-dashoffset:-180; } }
  @keyframes sqPulse { 0%,100% { opacity:.24; transform:scale(.86); } 50% { opacity:.82; transform:scale(1.14); } }
  @keyframes sqDrift { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  .dash { stroke-dasharray:10 17; animation:sqDash 13s linear infinite; }
  .dash2 { stroke-dasharray:6 18; animation:sqDash 17s linear infinite reverse; }
  .p { transform-box:fill-box; transform-origin:center; animation:sqPulse 4s ease-in-out infinite; }
  .p2 { animation-delay:.7s } .p3 { animation-delay:1.4s } .p4 { animation-delay:2.1s }
</style>
