  </linearGradient>
  <radialGradient id="r"><stop stop-color="#cffafe" stop-opacity=".8"/><stop offset="1" stop-color="#cffafe" stop-opacity="0"/></radialGradient>
</defs>
<ellipse cx="605" cy="358" rx="430" ry="265" fill="url(#r)" opacity=".36"/>
