<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 260" fill="none">
<style>
@keyframes dash{to{stroke-dashoffset:-140}}
@keyframes pulse{0%,100%{opacity:.28;transform:scale(.82)}50%{opacity:1;transform:scale(1.16)}}
.path{stroke-dasharray:10 15;animation:dash 7s linear infinite}
.node{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.n2{animation-delay:.45s}.n3{animation-delay:.9s}.n4{animation-delay:1.35s}.n5{animation-delay:1.8s}.n6{animation-delay:2.25s}
</style>
<defs>
  <linearGradient id="g" x1="70" y1="0" x2="1370" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0891b2"/>
    <stop offset=".5" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#0f172a"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<path d="M90 130C210 55 300 205 430 130S650 55 760 130s220 75 330 0 190-70 270 0" stroke="#0891b2" stroke-width="2" opacity=".14"/>
<path class="path" d="M90 130C210 55 300 205 430 130S650 55 760 130s220 75 330 0 190-70 270 0" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
<g filter="url(#glow)">
  <circle class="node" cx="90" cy="130" r="7" fill="#0891b2"/>
  <circle class="node n2" cx="350" cy="149" r="7" fill="#06b6d4"/>
  <circle class="node n3" cx="600" cy="92" r="7" fill="#22d3ee"/>
  <circle class="node n4" cx="835" cy="163" r="7" fill="#06b6d4"/>
  <circle class="node n5" cx="1085" cy="133" r="7" fill="#0891b2"/>
  <circle class="node n6" cx="1360" cy="130" r="7" fill="#0f172a"/>
</g>
</svg>