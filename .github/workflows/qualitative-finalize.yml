name: Finalize integrated Qualitative Lab

on:
  push:
    branches: [qualitative-cases-materials]
    paths:
      - scripts/finalize_qualitative_cases.py
      - .github/workflows/qualitative-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qualitative-cases-materials
          fetch-depth: 0

      - name: Restore integrated lab to original component path
        run: python3 scripts/finalize_qualitative_cases.py

      - name: Commit final component
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/QualitativeResearchLab.tsx
          git diff --cached --check
          git commit -m "Keep materials inside existing qualitative cases panel"
          git push origin HEAD:qualitative-cases-materials
