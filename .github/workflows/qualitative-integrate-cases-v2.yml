name: Qualitative cases integration

on:
  push:
    branches: [qualitative-cases-materials]
    paths:
      - scripts/integrate_qualitative_cases.py
      - .github/workflows/qualitative-integrate-cases-v2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: qualitative-cases-materials
          fetch-depth: 0

      - name: Integrate materials into existing Cases panel
        run: python3 scripts/integrate_qualitative_cases.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/QualitativeResearchLab.tsx components/QualitativeResearchLabLegacy.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Integrate materials into existing cases panel"
          git push origin HEAD:qualitative-cases-materials
