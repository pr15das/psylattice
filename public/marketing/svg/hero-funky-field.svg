<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
<style>
  @keyframes dashA { to { stroke-dashoffset:-190; } }
  @keyframes dashB { to { stroke-dashoffset:160; } }
  @keyframes pulse { 0%,100% { opacity:.28; transform:scale(.82); } 50% { opacity:.82; transform:scale(1.14); } }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  .a { stroke-dasharray:10 18; animation:dashA 14s linear infinite; }
  .b { stroke-dasharray:6 20; animation:dashB 18s linear infinite; }
  .p { transform-box:fill-box; transform-origin:center; animation:pulse 4s ease-in-out infinite; }
</style>
<defs>
  <linearGradient id="line1" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
    <stop stop-color="#22d3ee"/>
    <stop offset=".35" stop-color="#3b82f6"/>
    <stop offset=".68" stop-color="#8b5cf6"/>
    <stop offset="1" stop-color="#10b981"/>
  </linearGradient>
  <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(1210 320) rotate(132) scale(470 590)" gradientUnits="userSpaceOnUse">
    <stop stop-color="#dbeafe" stop-opacity=".72"/>
    <stop offset=".45" stop-color="#cffafe" stop-opacity=".38"/>
    <stop offset="1" stop-color="white" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(355 655) rotate(40) scale(390 420)" gradientUnits="userSpaceOnUse">
    <stop stop-color="#dcfce7" stop-opacity=".44"/>
    <stop offset="1" stop-color="white" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1600" height="900" fill="#f8fbfb"/>
<rect width="1600" height="900" fill="url(#glow1)"/>
<rect width="1600" height="900" fill="url(#glow2)"/>

